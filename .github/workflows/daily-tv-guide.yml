name: Daily football TV guide

on:
  workflow_dispatch:
    inputs:
      demo:
        description: "Send demo-data"
        required: false
        type: boolean
        default: false
      days:
        description: "Antall dager å teste"
        required: false
        type: choice
        options:
          - "1"
          - "7"
          - "30"
        default: "1"
  schedule:
    - cron: "5 7 * * *"
    - cron: "5 8 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post TV guide
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.demo }}" = "true" ]; then
            python bot.py --demo
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python bot.py --days "${{ inputs.days }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python bot.py --scheduled --days 1
          else
            python bot.py --days 1
          fi
